plugins {
    id 'java'
    id 'maven-publish'
}

group = 'fr.maif'

dependencies {

    implementation project(':jooq-async-api')
    implementation project(':jooq-async-reactive')

    implementation("io.vavr:vavr:$vavrVersion")
    implementation("org.jooq:jooq:$_jooqVersion")
    implementation("com.fasterxml.jackson.core:jackson-databind:$jacksonVersion")
    implementation("io.projectreactor:reactor-core:$reactorVersion")
    implementation("org.slf4j:slf4j-api:1.7.26")
    implementation("io.vertx:vertx-pg-client:5.0.0")

    testImplementation project(':jooq-async-api-tck')
    testImplementation("com.novocode:junit-interface:0.11")
    testImplementation("org.junit.jupiter:junit-jupiter-engine:5.9.0")
    testImplementation("org.junit.vintage:junit-vintage-engine:5.9.0")
    testImplementation("org.testcontainers:testcontainers:${testContainers}")
    testImplementation("org.testcontainers:postgresql:${testContainers}")

}

